<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit Product</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #dc3545;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            padding: 40px;
            max-width: 500px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .update-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .update-btn:hover {
            background-color: #0056b3;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #666;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <header>
        <h1>Edit Product</h1>
    </header>
    <div class="container">
        <div class="card">
            <form action="/admin/update-product" method="POST" enctype="multipart/form-data">
                <input type="hidden" name="id" value="{PRODUCT_ID}">

                <label>Product Name:</label>
                <input type="text" name="name" value="{PRODUCT_NAME}" required>

                <label>Price ($):</label>
                <input type="number" step="0.01" name="price" value="{PRODUCT_PRICE}" required>

                <label>New Image (Optional):</label>
                <input type="file" name="image" accept="image/*">

                <label>Description:</label>
                <textarea name="description" rows="4" required>{PRODUCT_DESC}</textarea>

                <button type="submit" class="update-btn">Update Product</button>
            </form>
            <a href="/admin" class="back-link">Back to Admin Dashboard</a>
        </div>
    </div>
</body>

</html>
