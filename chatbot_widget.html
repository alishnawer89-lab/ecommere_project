<!-- Fit Verse Chatbot Widget -->
<style>
    #fv-chat-btn {
        position: fixed;
        right: 22px;
        bottom: 22px;
        width: 58px;
        height: 58px;
        border-radius: 50%;
        background: #000;
        color: #fff;
        border: 2px solid #fff;
        font-size: 26px;
        cursor: pointer;
        z-index: 2000;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }

    #fv-chat-box {
        display: none;
        position: fixed;
        right: 22px;
        bottom: 92px;
        width: 340px;
        max-width: calc(100vw - 30px);
        height: 460px;
        max-height: calc(100vh - 120px);
        background: #111;
        color: #fff;
        border: 1px solid #333;
        border-radius: 10px;
        z-index: 2000;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
        font-family: 'Segoe UI', Tahoma, sans-serif;
    }

    #fv-chat-head {
        background: #000;
        padding: 14px 16px;
        font-weight: 800;
        font-size: 14px;
        letter-spacing: 1px;
        text-transform: uppercase;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #333;
    }

    #fv-chat-close {
        cursor: pointer;
        font-size: 20px;
        color: #aaa;
    }

    #fv-chat-msgs {
        flex: 1;
        overflow-y: auto;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .fv-msg {
        max-width: 82%;
        padding: 9px 12px;
        border-radius: 10px;
        font-size: 13px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-wrap: break-word;
    }

    .fv-user {
        align-self: flex-end;
        background: #fff;
        color: #000;
    }

    .fv-bot {
        align-self: flex-start;
        background: #222;
        color: #fff;
    }

    #fv-chat-form {
        display: flex;
        gap: 8px;
        padding: 10px;
        border-top: 1px solid #333;
        background: #000;
    }

    #fv-chat-input {
        flex: 1;
        padding: 10px;
        background: #1a1a1a;
        border: 1px solid #333;
        color: #fff;
        border-radius: 6px;
        font-size: 13px;
        outline: none;
    }

    #fv-chat-send {
        background: #fff;
        color: #000;
        border: none;
        padding: 0 14px;
        border-radius: 6px;
        font-weight: 800;
        cursor: pointer;
        font-size: 12px;
        text-transform: uppercase;
    }

    #fv-chat-send:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
</style>

<button id="fv-chat-btn" type="button" aria-label="Open chat">💬</button>

<div id="fv-chat-box">
    <div id="fv-chat-head">
        <span>Fit Verse Assistant</span>
        <span id="fv-chat-close">&times;</span>
    </div>
    <div id="fv-chat-msgs"></div>
    <form id="fv-chat-form">
        <input id="fv-chat-input" type="text" maxlength="500" placeholder="Apna sawal likhein..." autocomplete="off">
        <button id="fv-chat-send" type="submit">Send</button>
    </form>
</div>

<script>
    (function () {
        var btn = document.getElementById('fv-chat-btn');
        var box = document.getElementById('fv-chat-box');
        var closeBtn = document.getElementById('fv-chat-close');
        var msgs = document.getElementById('fv-chat-msgs');
        var form = document.getElementById('fv-chat-form');
        var input = document.getElementById('fv-chat-input');
        var sendBtn = document.getElementById('fv-chat-send');
        var history = [];

        function addMsg(text, who) {
            var div = document.createElement('div');
            div.className = 'fv-msg ' + (who === 'user' ? 'fv-user' : 'fv-bot');
            div.textContent = text;   // textContent => XSS safe
            msgs.appendChild(div);
            msgs.scrollTop = msgs.scrollHeight;
            return div;
        }

        function toggleChat() {
            box.style.display = (box.style.display === 'flex') ? 'none' : 'flex';
            if (box.style.display === 'flex') {
                if (!msgs.children.length) {
                    addMsg('Hi! Main Fit Verse ka assistant hu. Products, price, size ya order ke baare mein kuch bhi poochein 🙂', 'bot');
                }
                input.focus();
            }
        }

        btn.addEventListener('click', toggleChat);
        closeBtn.addEventListener('click', toggleChat);

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            var text = input.value.trim();
            if (!text) return;

            addMsg(text, 'user');
            input.value = '';
            sendBtn.disabled = true;
            var typing = addMsg('Typing...', 'bot');

            fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text, history: history.slice(-6) })
            })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    var reply = data.reply || 'Sorry, kuch masla aa gaya.';
                    typing.textContent = reply;
                    history.push({ role: 'user', text: text });
                    history.push({ role: 'model', text: reply });
                })
                .catch(function () {
                    typing.textContent = 'Server se connect nahi ho paya. Dobara try karein.';
                })
                .finally(function () {
                    sendBtn.disabled = false;
                    msgs.scrollTop = msgs.scrollHeight;
                    input.focus();
                });
        });
    })();
</script>
